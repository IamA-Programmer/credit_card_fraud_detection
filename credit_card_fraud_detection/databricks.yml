# This is a Declarative Automation Bundle definition for credit_card_fraud_detection.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: credit_card_fraud_detection
  uuid: deac98ab-c58a-4d07-8dec-09b945664843

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-98a39b50-ba50.cloud.databricks.com
    variables:
      catalog: credit_card_fraud_detection_dev
      # schema: dev
      schema : rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-98a39b50-ba50.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kishorecoder685@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kishorecoder685@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: credit_card_fraud_detection_dev
      # schema: prod
      schema: rnd
    # Permissions are optional, whenever we are creating any artifacts in production, so we can set up their permission as well
    permissions:
      - user_name: kishorecoder685@gmail.com
        level: CAN_MANAGE
