# The main pipeline for credit_card_fraud_detection

resources:
  pipelines:
    credit_card_fraud_detection_etl:
      name: credit_card_fraud_detection_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/credit_card_fraud_detection_etl"

      libraries:
        - glob:
            include: ../src/credit_card_fraud_detection_etl/transformations/**
            # 

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
